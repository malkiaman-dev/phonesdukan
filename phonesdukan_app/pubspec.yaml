name: phonesdukan_app
description: PhonesDukan official Android app — loads the live ecommerce website.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # WebView (uploads, downloads, caching, cookies)
  flutter_inappwebview: ^6.1.5

  # Connectivity & external apps
  connectivity_plus: ^6.1.4
  url_launcher: ^6.3.1

  # Permissions (camera, storage)
  permission_handler: ^11.4.0

  # File downloads with progress notifications
  flutter_downloader: ^1.12.0
  path_provider: ^2.1.5
  open_filex: ^4.6.0

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_native_splash: ^2.4.5
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  assets:
    - assets/images/

flutter_native_splash:
  color: "#111111"
  image: assets/images/logo.png
  android_12:
    color: "#111111"
    image: assets/images/logo.png
  android: true
  ios: false

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/images/app-icon.png
  adaptive_icon_background: "#F9B000"
  adaptive_icon_foreground: assets/images/app-icon.png
